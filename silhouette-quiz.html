<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シルエットクイズ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #111;
  color: #fff;
  font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

kbd {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 5px;
  padding: .15rem .45rem;
  font-size: .8rem;
  color: #ccc;
  font-family: monospace;
}

/* ── TITLE ── */
#titleScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 1.8rem;
  background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0a 100%);
  text-align: center;
  padding: 2rem;
}
#titleScreen h1 {
  font-size: clamp(2.5rem, 9vw, 5.5rem);
  font-weight: 900;
  letter-spacing: .06em;
  background: linear-gradient(135deg, #f9d71c, #ff6b6b, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#titleScreen .sub {
  font-size: clamp(.95rem, 2.5vw, 1.3rem);
  color: #888;
  line-height: 1.9;
}
#startBtn {
  background: linear-gradient(135deg, #f9d71c, #f97316);
  border: none; border-radius: 50px;
  padding: 1rem 3.5rem;
  font-size: 1.6rem; font-weight: 900; color: #111;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 0 30px rgba(249,215,28,.4);
}
#startBtn:hover { transform: scale(1.07); box-shadow: 0 0 50px rgba(249,215,28,.7); }
.key-hint { font-size: .8rem; color: #444; }

/* ── QUIZ SCREEN ── */
#quizScreen { display: none; height: 100vh; position: relative; }

#progress { position: absolute; top:0; left:0; right:0; height:5px; background:#1c1c1c; z-index:10; }
#progressBar { height:100%; background: linear-gradient(90deg,#a855f7,#f9d71c); transition: width .4s ease; }
#qCounter { position:absolute; top:14px; right:20px; font-size:.85rem; color:#444; z-index:10; }

/* ── SLIDE CONTAINER ── */
#slideArea {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 3rem 2rem 4rem;
}

/* ── PHASE LABEL ── */
.phase-label {
  position: absolute;
  top: 22px; left: 50%;
  transform: translateX(-50%);
  font-size: clamp(1.2rem, 3.5vw, 1.8rem);
  font-weight: 900;
  letter-spacing: .08em;
  white-space: nowrap;
}
.phase-label.shadow { color: #f9d71c; text-shadow: 0 0 20px rgba(249,215,28,.5); }
.phase-label.trick  { color: #f97316; text-shadow: 0 0 20px rgba(249,115,22,.5); }
.phase-label.answer { color: #4ade80; text-shadow: 0 0 20px rgba(74,222,128,.5); }

/* ── CARD IMAGE WRAPPER ── */
.card-wrap {
  position: relative;
  max-width: min(80vw, 720px);
  max-height: 70vh;
}
.card-wrap img {
  display: block;
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 8px 40px rgba(0,0,0,.7);
}

/* Phase 0: clip to show only left half */
.card-wrap.phase-shadow {
  overflow: hidden;
  animation: none;
}
.card-wrap.phase-shadow img {
  /* clip right half — we animate the wrapper width from 50% → 100% */
  display: block;
  width: min(80vw, 720px);
  max-height: 70vh;
  object-fit: contain;
  object-position: left center;
}
/* overlay covers right half */
.card-wrap.phase-shadow::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 50%; height: 100%;
  background: #111;
}

/* Phase 1: reveal full card */
.card-wrap.phase-trick img {
  animation: revealRight .55s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes revealRight {
  from { clip-path: inset(0 50% 0 0 round 12px); }
  to   { clip-path: inset(0 0%  0 0 round 12px); }
}

/* Phase 2: answer pop-in */
.card-wrap.phase-answer img {
  animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
}

/* ── CONFETTI ── */
.cf {
  position: fixed;
  border-radius: 2px;
  animation: cfFall linear forwards;
  pointer-events: none;
  z-index: 50;
}
@keyframes cfFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
}

/* ── NAV HINT ── */
#navHint {
  position: absolute;
  bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: .8rem;
  color: #333;
}

/* ── END SCREEN ── */
#endScreen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100vh; gap: 2rem; text-align: center;
  background: radial-gradient(ellipse at center, #0a1f0a 0%, #0a0a0a 100%);
}
#endScreen h2 {
  font-size: clamp(2rem, 7vw, 4rem); font-weight: 900;
  background: linear-gradient(135deg,#4ade80,#f9d71c);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.end-btns { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
.end-btn {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 30px; padding: .7rem 2rem;
  font-size: 1rem; color: #fff; cursor: pointer;
  font-weight: 700; transition: background .18s; text-decoration: none;
}
.end-btn:hover { background: rgba(255,255,255,.16); }
.end-btn.primary {
  background: linear-gradient(135deg,#f9d71c,#f97316);
  color: #111; border: none;
}

@keyframes popIn {
  from { transform: scale(.3); opacity:0; }
  to   { transform: scale(1);  opacity:1; }
}
</style>
</head>
<body>

<!-- ── TITLE ── -->
<div id="titleScreen">
  <div style="font-size:clamp(3rem,10vw,6rem)">🔦</div>
  <h1>シルエットクイズ</h1>
  <div class="sub">
    シルエットを見て　なんの生き物か当てよう！<br>
    ひっかけに　気をつけて…
  </div>
  <button id="startBtn" onclick="startQuiz()">▶ スタート</button>
  <div class="key-hint">
    <kbd>Space</kbd> / <kbd>→</kbd> 次へ &nbsp;·&nbsp;
    <kbd>←</kbd> 戻る &nbsp;·&nbsp;
    <kbd>T</kbd> ひっかけをスキップ
  </div>
</div>

<!-- ── QUIZ ── -->
<div id="quizScreen">
  <div id="progress"><div id="progressBar" style="width:0%"></div></div>
  <div id="qCounter"></div>
  <div id="slideArea"></div>
  <div id="navHint"></div>
</div>

<!-- ── END ── -->
<div id="endScreen">
  <div style="font-size:4rem">🎉</div>
  <h2>ぜんもん　おわり！</h2>
  <div style="color:#888;font-size:1.1rem">よくできました！</div>
  <div class="end-btns">
    <button class="end-btn primary" onclick="startQuiz()">もう一度</button>
    <a href="index.html" class="end-btn">🏠 ホーム</a>
  </div>
</div>

<script>
// =================================================================
// QUIZ DATA
// cardImg  : 左=シルエット・右=ひっかけ の1枚画像
// answerImg: 正解画像
// shadowImg: (省略可) シルエットだけの画像 — あればフェーズ0で使用
// emoji    : 画像読み込み失敗時のフォールバック絵文字
// =================================================================
const P = 'quiz-imgs/';  // image folder prefix
const SS = 'スクリーンショット 2026-05-12 ';

const QUIZZES = [
  {
    cardImg:   P + SS + '152922.png',
    answerImg: P + SS + '152931.png',
    emoji: '🍎',
  },
  {
    cardImg:   P + SS + '152954.png',
    answerImg: P + SS + '153007.png',
    emoji: '🐧',
  },
  {
    shadowImg: P + SS + '153431.png',   // きれいな黒シルエット
    cardImg:   P + SS + '153029.png',   // ひっかけ用カード
    answerImg: P + SS + '153418.png',   // 大きな正解イラスト
    emoji: '🐘',
  },
  {
    cardImg:   P + SS + '153103.png',
    answerImg: P + SS + '153111.png',
    emoji: '🦑',
  },
  {
    cardImg:   P + SS + '153246.png',
    answerImg: P + SS + '153332.png',
    emoji: '🎹',
  },
];

// =================================================================
// STATE
// =================================================================
let qIdx  = 0;
let phase = 0;  // 0=shadow  1=trick  2=answer

// =================================================================
// RENDER
// =================================================================
function render() {
  const q     = QUIZZES[qIdx];
  const total = QUIZZES.length;
  const area  = document.getElementById('slideArea');
  const hint  = document.getElementById('navHint');

  document.getElementById('qCounter').textContent = `${qIdx + 1} / ${total}`;
  document.getElementById('progressBar').style.width =
    `${((qIdx * 3 + phase) / (total * 3)) * 100}%`;

  area.innerHTML = '';

  // ── phase label ──
  const labelEl = document.createElement('div');
  labelEl.className = 'phase-label';

  // ── card wrapper ──
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';

  const img = document.createElement('img');
  img.alt = '';

  if (phase === 0) {
    // SHADOW: 左半分だけ見せる
    labelEl.textContent = 'これ　なーんだ？';
    labelEl.classList.add('shadow');

    if (q.shadowImg) {
      // 独立したシルエット画像がある場合はそのまま表示
      img.src = q.shadowImg;
      img.onerror = () => { img.src=''; img.alt = q.emoji; img.style.fontSize='clamp(6rem,20vw,12rem)'; };
      wrap.classList.add('phase-answer'); // 普通にpop-inだけ
    } else {
      // 結合カードを左半分クリップ
      img.src = q.cardImg;
      wrap.classList.add('phase-shadow');
    }

    hint.innerHTML = `<kbd>Space</kbd> / <kbd>→</kbd> で答えを見る`;
  }
  else if (phase === 1) {
    // TRICK: 結合カードを全体表示（右半分スライドイン）
    labelEl.textContent = 'あーんしてる…？';
    labelEl.classList.add('trick');

    img.src = q.cardImg;
    wrap.classList.add('phase-trick');

    hint.innerHTML = `<kbd>Space</kbd> / <kbd>→</kbd> 正解へ &nbsp;·&nbsp; <kbd>←</kbd> 戻る`;
  }
  else {
    // ANSWER: 正解画像
    labelEl.textContent = 'もちろん…';
    labelEl.classList.add('answer');

    img.src = q.answerImg;
    wrap.classList.add('phase-answer');
    spawnConfetti();

    const isLast = qIdx === total - 1;
    hint.innerHTML = isLast
      ? `<kbd>Space</kbd> おわり！`
      : `<kbd>Space</kbd> / <kbd>→</kbd> 次の問題へ &nbsp;·&nbsp; <kbd>←</kbd> 戻る`;
  }

  // emoji fallback
  img.onerror = function() {
    this.style.display = 'none';
    const fb = document.createElement('div');
    fb.textContent = q.emoji;
    fb.style.cssText = 'font-size:clamp(6rem,20vw,12rem);line-height:1';
    wrap.appendChild(fb);
  };

  wrap.appendChild(img);
  area.appendChild(labelEl);
  area.appendChild(wrap);
}

// =================================================================
// NAVIGATION
// =================================================================
function advance() {
  if (phase < 2) {
    phase++;
    render();
  } else if (qIdx < QUIZZES.length - 1) {
    qIdx++;
    phase = 0;
    render();
  } else {
    showEnd();
  }
}

function back() {
  if (phase > 0) {
    phase--;
    render();
  } else if (qIdx > 0) {
    qIdx--;
    phase = 2;
    render();
  }
}

function skipTrick() {
  if (phase < 2) { phase = 2; render(); }
}

// =================================================================
// SCREENS
// =================================================================
function startQuiz() {
  qIdx = 0; phase = 0;
  document.getElementById('titleScreen').style.display  = 'none';
  document.getElementById('endScreen').style.display    = 'none';
  document.getElementById('quizScreen').style.display   = 'block';
  render();
}

function showEnd() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('endScreen').style.display  = 'flex';
  spawnConfetti(80);
}

// =================================================================
// CONFETTI
// =================================================================
function spawnConfetti(n = 35) {
  const COLORS = ['#f9d71c','#f97316','#a855f7','#4ade80','#22d3ee','#fb7185'];
  for (let i = 0; i < n; i++) {
    const cf = document.createElement('div');
    cf.className = 'cf';
    cf.style.cssText = `
      left:${Math.random()*100}vw;
      top:${-10-Math.random()*10}px;
      background:${COLORS[i % COLORS.length]};
      width:${7+Math.random()*9}px; height:${7+Math.random()*9}px;
      animation-duration:${1.4+Math.random()*1.6}s;
      animation-delay:${Math.random()*.5}s;
    `;
    document.body.appendChild(cf);
    cf.addEventListener('animationend', () => cf.remove());
  }
}

// =================================================================
// KEYBOARD
// =================================================================
document.addEventListener('keydown', e => {
  const onQuiz = document.getElementById('quizScreen').style.display !== 'none';
  if (!onQuiz) {
    if (e.key === 'Enter' || e.key === ' ') startQuiz();
    return;
  }
  switch (e.key) {
    case ' ': case 'ArrowRight': case 'Enter':
      e.preventDefault(); advance(); break;
    case 'ArrowLeft':
      e.preventDefault(); back(); break;
    case 't': case 'T':
      skipTrick(); break;
  }
});
</script>
</body>
</html>
